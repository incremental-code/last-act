<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero Framework Example</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    button {
      padding: 8px 16px;
      margin: 4px;
      cursor: pointer;
    }
    .item {
      padding: 8px;
      margin: 4px 0;
      background: #f0f0f0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { Signal, createElement as h } from './zero.js';

    const count = new Signal(0);
    const items = new Signal([
      { id: 1, name: 'Apple' },
      { id: 2, name: 'Banana' },
      { id: 3, name: 'Cherry' },
    ]);

    function ItemDisplay(item) {
      return h('div', { attributes: { class: 'item' } }, item.name);
    }

    function renderItems() {
      return items.get().map(ItemDisplay);
    }

    function App() {
      const itemElements = new Signal(renderItems());

      // Subscribe to items changes and update itemElements
      items.subscribe(() => {
        itemElements.set(renderItems());
      });

      return h(
        'div',
        {},
        h('h1', {}, 'Zero Framework Demo'),
        h(
          'div',
          {},
          h('p', {}, 'Count: '),
          h('span', { textContent: count }, ''),
          h('button', { onclick: () => count.set(count.get() + 1) }, 'Increment'),
          h('button', { onclick: () => count.set(0) }, 'Reset')
        ),
        h('h2', {}, 'Items'),
        h(
          'div',
          {},
          itemElements
        ),
        h('button', { onclick: addItem }, 'Add Item'),
        h('button', { onclick: removeItem }, 'Remove Item')
      );
    }

    function addItem() {
      const current = items.get();
      const newId = Math.max(...current.map(i => i.id)) + 1;
      items.set([...current, { id: newId, name: `Item ${newId}` }]);
    }

    function removeItem() {
      const current = items.get();
      if (current.length > 0) {
        items.set(current.slice(0, -1));
      }
    }

    const app = document.getElementById('app');
    const root = App();
    app.appendChild(root);
  </script>
</body>
</html>
